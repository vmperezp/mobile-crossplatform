# ============================================================================
#  PERFIL iOS
#  Ejecucion:  ./gradlew clean test aggregate -Dproperties=serenity-ios.properties --tests "*IosRunner"
#  Serenity lee el archivo indicado en la system property "properties";
#  por eso las capabilities de cada plataforma viven en su propio archivo.
# ============================================================================

serenity.project.name = Mobile Cross Platform Lab - iOS
webdriver.driver = appium

appium.hub = https://TU_USUARIO:TU_ACCESS_KEY@mobile-hub.lambdatest.com/wd/hub

## ---- Capabilities de LambdaTest -------------------------------------------
appium.isRealMobile = true
appium.network = true
appium.visual = true
appium.devicelog = true
appium.console = true

appium.w3c = true

## ---- Capabilities del dispositivo / plataforma ----------------------------
appium.platformName = iOS
appium.deviceName = iPhone.*
appium.platformVersion = 17
appium.automationName = XCUITest
appium.deviceOrientation = portrait
appium.build=52
appium.name=1
## App bajo prueba: Lab Negocios (proyecto Flutter lab_auth), .ipa sin firmar.
## LambdaTest la refirma al subirla. Ver README.
appium.app = lt://APP10160321611788559426382841
## ---- Capabilities propias de Appium (prefijo w3c) -------------------------
appium.capabilities.appium\:newCommandTimeout = 300
appium.capabilities.appium\:autoAcceptAlerts = true
appium.capabilities.appium\:fullReset = true
appium.capabilities.appium\:wdaLaunchTimeout = 120000

## ---- Reportes / esperas ----------------------------------------------------
serenity.take.screenshots = FOR_FAILURES
serenity.timeout = 10000
serenity.compress.filenames = false
serenity.reports.show.step.details = true
