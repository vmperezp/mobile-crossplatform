# ============================================================================
#  PERFIL POR DEFECTO: ANDROID
#  Ejecucion:  ./gradlew clean test aggregate --tests "*AndroidRunner"
#  El perfil de iOS esta en serenity-ios.properties y se activa con:
#              -Dproperties=serenity-ios.properties
# ============================================================================

serenity.project.name = Mobile Cross Platform Lab - Android
webdriver.driver = appium

## ---------------------------------------------------------------------------
## Grid de LambdaTest (mobile-hub)
## El usuario y el access key NO se versionan: los scripts run-android.sh /
## run-ios.sh arman la URL desde $LT_USERNAME y $LT_ACCESS_KEY y la inyectan
## con -Dappium.hub (una system property siempre gana sobre este archivo).
## ---------------------------------------------------------------------------
appium.hub = https://TU_USUARIO:TU_ACCESS_KEY@mobile-hub.lambdatest.com/wd/hub

## ---- Capabilities de LambdaTest -------------------------------------------
appium.isRealMobile = true
appium.network = true
appium.visual = true
appium.devicelog = true
appium.console = true
appium.build = Mobile Cross Platform Lab
appium.name = Regresion Android
appium.w3c = true

## ---- Capabilities del dispositivo / plataforma ----------------------------
appium.platformName = Android
appium.deviceName = Galaxy.*
appium.platformVersion = 15
appium.automationName = UiAutomator2
appium.deviceOrientation = portrait

## App bajo prueba: Lab Negocios (proyecto Flutter lab_auth), APK. Ver README.
appium.app = lt://APP_ID_ANDROID

## ---- Capabilities propias de Appium (prefijo w3c) -------------------------
appium.capabilities.appium\:appWaitForLaunch = true
appium.capabilities.appium\:newCommandTimeout = 300
appium.capabilities.appium\:autoGrantPermissions = true
appium.capabilities.appium\:fullReset = true

## ---- Reportes / esperas ----------------------------------------------------
serenity.take.screenshots = FOR_FAILURES
serenity.timeout = 10000
serenity.compress.filenames = false
serenity.reports.show.step.details = true
