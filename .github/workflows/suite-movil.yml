name: Suite movil en LambdaTest

on:
  workflow_dispatch:
    inputs:
      plataforma:
        description: 'Plataforma sobre la que ejecutar'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - android
      alcance:
        description: 'Escenarios a ejecutar'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - completa

jobs:
  ejecutar:
    name: ${{ inputs.plataforma }} - ${{ inputs.alcance }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Permisos de ejecucion al wrapper
        run: chmod +x ./gradlew

      - name: Resolver parametros de la ejecucion
        id: parametros
        run: |
          if [ "${{ inputs.plataforma }}" = "ios" ]; then
            echo "perfil=serenity-ios.properties" >> "$GITHUB_OUTPUT"
            echo "runner=*IosRunner"              >> "$GITHUB_OUTPUT"
            echo "app=${{ secrets.LT_APP_IOS }}"  >> "$GITHUB_OUTPUT"
          else
            echo "perfil=serenity.properties"        >> "$GITHUB_OUTPUT"
            echo "runner=*AndroidRunner"             >> "$GITHUB_OUTPUT"
            echo "app=${{ secrets.LT_APP_ANDROID }}" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ inputs.alcance }}" = "smoke" ]; then
            echo "tags=--tags @Smoke" >> "$GITHUB_OUTPUT"
          else
            echo "tags=" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificacion previa
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          ./gradlew test --tests "*PreflightTest" \
            -Dproperties=${{ steps.parametros.outputs.perfil }} \
            -Dappium.app="${{ steps.parametros.outputs.app }}" \
            -Dappium.hub="https://$LT_USERNAME:$LT_ACCESS_KEY@mobile-hub.lambdatest.com/wd/hub"

      - name: Ejecutar la suite
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          ./gradlew clean test --tests "${{ steps.parametros.outputs.runner }}" aggregate \
            -Dproperties=${{ steps.parametros.outputs.perfil }} \
            -Dappium.app="${{ steps.parametros.outputs.app }}" \
            -Dappium.build="GitHub Actions ${{ github.run_number }}" \
            -Dcucumber.options="${{ steps.parametros.outputs.tags }}" \
            -Dappium.hub="https://$LT_USERNAME:$LT_ACCESS_KEY@mobile-hub.lambdatest.com/wd/hub"

      - name: Publicar el reporte de Serenity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-${{ inputs.plataforma }}-${{ github.run_number }}
          path: target/site/serenity
          retention-days: 30
